name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build release binary
        run: cargo build --release --locked

      - name: Preload reference data
        run: cargo run --release --bin sgd-annotator -- --input tests/genome.txt.gz --output /tmp/test-output.tsv

      - name: Run tests
        run: cargo test --locked -- --test-threads=1
